<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Appointment — Patuakhali Salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">Patuakhali Salon</a>
    <nav class="main-nav" id="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="stylists.html">Stylists</a></li>
        <li><a href="book.html" aria-current="page">Book</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
  </div>
</header>

<section>
  <div class="container">
    <div class="section-head">
      <h1>Book an Appointment</h1>
      <p>One service per booking. Pick what you'd like, who you'd like it from, and a time that works.</p>
    </div>

    <form id="booking-form" novalidate>
      <div class="form-grid">
        <div class="form-field">
          <label for="first_name">First name</label>
          <input type="text" id="first_name" name="first_name" required>
        </div>
        <div class="form-field">
          <label for="last_name">Last name</label>
          <input type="text" id="last_name" name="last_name" required>
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone">
        </div>

        <div class="form-field full">
          <label for="service_id">Service</label>
          <select id="service_id" name="service_id" required>
            <option value="">Loading services…</option>
          </select>
        </div>

        <div class="form-field full">
          <label for="staff_id">Stylist</label>
          <select id="staff_id" name="staff_id" required>
            <option value="">Loading stylists…</option>
          </select>
        </div>

        <div class="form-field">
          <label for="appointment_date">Date</label>
          <input type="date" id="appointment_date" name="appointment_date" required>
        </div>
        <div class="form-field">
          <label for="start_time">Time</label>
          <input type="time" id="start_time" name="start_time" required>
        </div>
      </div>

      <p class="form-status" id="form-status"></p>

      <button type="submit" class="btn">Confirm booking</button>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <span>&copy; 2026 Patuakhali Salon</span>
  </div>
</footer>

<script src="js/nav.js"></script>
<script src="js/book.js"></script>
</body>
</html>
